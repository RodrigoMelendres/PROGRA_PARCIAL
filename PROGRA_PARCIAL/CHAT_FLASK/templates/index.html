<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat UDABOL IA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        #chat { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; }
    </style>
</head>
<body>
    <h1>Asistente UDABOL</h1>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Escribe tu mensaje...">
    <button onclick="enviar()">Enviar</button>

    <script>
        const socket = io();

        // Escuchar mensajes que vienen del servidor (Flask)
        socket.on('message', function(data) {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<p>${data}</p>`;
            chat.scrollTop = chat.scrollHeight; // Auto-scroll al final
        });

        // Enviar mensaje al servidor
        function enviar() {
            const input = document.getElementById('msg');
            socket.send(input.value);
            input.value = '';
        }
    </script>
</body>
</html>

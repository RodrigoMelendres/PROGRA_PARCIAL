<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA UDABOL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #004a99; --bg: #f0f2f5; --bubble-user: #004a99; --bubble-ia: #e4e6eb; }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; height: 100vh; align-items: center; }
        
        #chat-container { width: 95%; max-width: 450px; height: 80vh; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--primary); color: white; padding: 20px; text-align: center; font-weight: 600; font-size: 1.2rem; }
        
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        .user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
        .ia { align-self: flex-start; background: var(--bubble-ia); color: #333; border-bottom-left-radius: 4px; }
        
        #input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; background: white; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background: #003366; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="chat-container">
    <header>Asistente UDABOL</header>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="Escribe tu consulta...">
        <button onclick="enviar()">Enviar</button>
    </div>
</div>

<script>
    const socket = io();
    const chat = document.getElementById('chat');

    socket.on('message', function(data) {
        const div = document.createElement('div');
        // Identificamos quién envió el mensaje
        div.className = data.includes('👤') ? 'msg user' : 'msg ia';
        // Limpiamos los prefijos para que se vea más limpio
        div.innerText = data.replace('👤 Tú:', '').replace('👤 Usuario:', '').replace('🤖 IA:', '');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    });

    function enviar() {
        const input = document.getElementById('msg');
        if(input.value.trim() !== "") {
            socket.send(input.value);
            input.value = '';
        }
    }

    document.getElementById('msg').addEventListener('keypress', (e) => { if(e.key === 'Enter') enviar(); });
</script>
</body>
</html>
